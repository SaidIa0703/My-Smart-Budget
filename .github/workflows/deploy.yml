name: Build and Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Un seul déploiement à la fois
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    # Runner auto-hébergé installé sur le serveur maison
    runs-on: [self-hosted, serveur-maison]

    steps:
      - uses: actions/checkout@v4

      - name: Build Backend
        run: docker build -t abedel/my-smart-budget-backend:latest ./APP/MY_budget/backend

      - name: Build Frontend
        run: docker build --build-arg NEXT_PUBLIC_API_URL=https://smarterbudget.net/api -t abedel/my-smart-budget-frontend:latest ./APP/MY_budget/frontend

      # Le docker-compose.yml et le .env (secrets) de production restent sur le serveur
      - name: Deploy
        run: docker compose -f /opt/mysmartbudget/docker-compose.yml up -d --force-recreate backend frontend

      - name: Health check
        run: |
          for i in $(seq 1 12); do
            if curl -fsS http://127.0.0.1:5001/health >/dev/null && curl -fsS -o /dev/null http://127.0.0.1:3000/; then
              echo "Site OK"; exit 0
            fi
            sleep 5
          done
          echo "Le site ne répond pas après le déploiement"; docker logs --tail 30 smart-budget-backend; exit 1

      - name: Clean up
        if: always()
        run: docker image prune -f
