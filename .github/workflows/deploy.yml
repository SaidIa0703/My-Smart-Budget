name: Build and Deploy

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Build Backend
        run: docker build -t abedel/my-smart-budget-backend:latest ./backend
      
      - name: Build Frontend
        run: docker build -t abedel/my-smart-budget-frontend:latest ./frontend
      
      - name: Push Backend
        run: docker push abedel/my-smart-budget-backend:latest
      
      - name: Push Frontend
        run: docker push abedel/my-smart-budget-frontend:latest
      
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd ~/my-smart-budget/APP/MY_budget
            docker-compose down
            docker-compose pull
            docker-compose up -d
