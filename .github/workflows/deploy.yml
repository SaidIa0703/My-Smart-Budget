name: Build and Deploy

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Build Backend
        run: docker build -t abedel/my-smart-budget-backend:latest ./APP/MY_budget/backend
      
      - name: Build Frontend
        run: docker build -t abedel/my-smart-budget-frontend:latest ./APP/MY_budget/frontend
      
      - name: Push Backend
        run: docker push abedel/my-smart-budget-backend:latest
      
      - name: Push Frontend
        run: docker push abedel/my-smart-budget-frontend:latest

      - name: Copy docker-compose to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: "APP/MY_budget/docker-compose.yml"
          target: "/home/ec2-user/my-smart-budget"
          strip_components: 2

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd ~/my-smart-budget
            docker-compose pull
            docker-compose up -d --force-recreate
            docker image prune -f
