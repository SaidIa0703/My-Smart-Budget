name: Build and Deploy

on:
  push:
    branches: [ main ]

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install & test backend
        working-directory: APP/MY_budget/backend
        run: npm install --ignore-scripts && npm test

      - name: Install & test frontend
        working-directory: APP/MY_budget/frontend
        run: npm install && npm test

  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    needs: test  # Le déploiement ne se lance que si les tests passent

    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Backend
        run: docker build -t abedel/my-smart-budget-backend:latest ./APP/MY_budget/backend

      - name: Build Frontend
        run: docker build --build-arg NEXT_PUBLIC_API_URL=https://smarterbudget.net/api -t abedel/my-smart-budget-frontend:latest ./APP/MY_budget/frontend

      - name: Save images
        run: |
          docker save abedel/my-smart-budget-frontend:latest | gzip > frontend.tar.gz
          docker save abedel/my-smart-budget-backend:latest | gzip > backend.tar.gz

      - name: Copy images to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: "frontend.tar.gz,backend.tar.gz"
          target: "/home/ec2-user/"

      - name: Copy docker-compose to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: "APP/MY_budget/docker-compose.yml"
          target: "/home/ec2-user/my-smart-budget"
          strip_components: 2

      - name: Load images and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            docker load < ~/frontend.tar.gz
            docker load < ~/backend.tar.gz
            cd ~/my-smart-budget
            docker-compose up -d --force-recreate
            docker image prune -f
