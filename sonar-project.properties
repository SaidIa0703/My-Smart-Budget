sonar.projectKey=SaidIa0703_My-Smart-Budget
sonar.projectName=My Smart Budget
sonar.projectVersion=1.0.0
sonar.organization=saidia0703

# Sources
sonar.sources=APP/MY_budget/backend
sonar.exclusions=**/node_modules/**,**/coverage/**,**/*.test.js,**/*.spec.js
sonar.tests=APP/MY_budget/backend/tests

# Couverture (générée par Jest --coverage)
sonar.javascript.lcov.reportPaths=APP/MY_budget/backend/coverage/lcov.info

sonar.sourceEncoding=UTF-8

# Quality Gate
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

# Ignorer complexité cyclomatique sur le fichier d'entrée principal
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=javascript:S3776
sonar.issue.ignore.multicriteria.e1.resourceKey=**/index.js
